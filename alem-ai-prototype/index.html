<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alem AI Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F1F1F7;--panel:#fff;--line:#E1E2EB;--text:#181B3A;--muted:#6B7080;--accent:#6352C6;--lime:#C8F27A;--chip:#ECEDF3}
[data-theme=dark]{--bg:#070817;--panel:#101333;--line:#2A2F63;--text:#EEF0FF;--muted:#9AA0CC;--accent:#8B7BFF;--chip:#1A1E4A}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
header{height:56px;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.06em;font-size:15px}
.logo b{width:22px;height:22px;border-radius:6px;background:var(--lime);position:relative;display:block}
.logo b:after{content:'';position:absolute;left:6px;top:6px;width:10px;height:10px;border-radius:3px;background:#181B3A}
.sub{color:var(--muted);font-size:13px;font-weight:500}
.sp{flex:1}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{font:inherit;font-size:13px;font-weight:600;border:0;background:none;color:var(--muted);padding:6px 14px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
main{display:flex;flex:1;min-height:0}
nav{width:250px;flex:none;padding:16px 12px;border-right:1px solid var(--line);background:var(--panel)}
nav h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 10px 6px}
nav h2:first-child{margin-top:0}
nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;color:var(--text);text-decoration:none;font-size:14px;font-weight:600;cursor:pointer}
nav a:hover{background:var(--chip)}
nav a.on{background:var(--accent);color:#fff}
nav a i{font-style:normal;width:22px;height:22px;border-radius:6px;background:var(--chip);color:var(--muted);font-size:12px;display:flex;align-items:center;justify-content:center;flex:none}
nav a.on i{background:rgba(255,255,255,.22);color:#fff}
.stage{flex:1;min-width:0;padding:22px;display:flex;flex-direction:column;align-items:center;gap:12px}
.info{width:100%;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.info b{color:var(--text);font-size:16px}
.tag{background:var(--chip);border-radius:20px;padding:3px 10px;font-weight:600;font-size:12px}
.frame{transform-origin:top left;border-radius:10px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.18)}
.frame iframe{border:0;display:block;background:transparent}
.hint{font-size:12px;color:var(--muted)}
@media(max-width:820px){main{flex-direction:column}nav{width:100%;display:flex;gap:6px;overflow-x:auto;padding:10px;border-right:0;border-bottom:1px solid var(--line)}nav h2{display:none}nav a{white-space:nowrap;flex:none}.sub,.hint{display:none}.stage{padding:12px}}
</style></head>
<body>
<header><div class="logo"><b></b>ALEM AI</div><span class="sub">Interactive prototype</span><span class="sp"></span>
<div class="seg" role="group" aria-label="Theme"><button id="tl" aria-pressed="true">Light</button><button id="td" aria-pressed="false">Dark</button></div></header>
<main><nav id="nav"></nav>
<section class="stage"><div class="info"><b id="ttl"></b><span class="tag" id="role"></span><span class="sp"></span><span class="hint">Use ← → to switch screens</span></div>
<div id="box"><div class="frame" id="frame"><iframe id="fr" title="Prototype screen" scrolling="no"></iframe></div></div></section></main>
<script>
const M=[{"slug": "1-login", "title": "Login and registration", "role": "All users", "w": 960, "h": {"light": 639, "dark": 639}}, {"slug": "2-create-hackathon", "title": "Create hackathon", "role": "Administrator", "w": 960, "h": {"light": 1176, "dark": 1176}}, {"slug": "3-team-application", "title": "Team application", "role": "Participant", "w": 960, "h": {"light": 1054, "dark": 1054}}, {"slug": "4-moderation", "title": "Moderation and experts", "role": "Administrator", "w": 960, "h": {"light": 692, "dark": 692}}, {"slug": "5-expert-projects", "title": "Assigned projects", "role": "Expert", "w": 960, "h": {"light": 805, "dark": 805}}, {"slug": "6-scoring-ai", "title": "Scoring with AI summary", "role": "Expert", "w": 960, "h": {"light": 911, "dark": 938}}, {"slug": "7-results", "title": "Results and ranking", "role": "Administrator", "w": 960, "h": {"light": 801, "dark": 934}}, {"slug": "8-mobile", "title": "Mobile views (360 px)", "role": "All roles", "w": 1180, "h": {"light": 787, "dark": 787}}];
const $=id=>document.getElementById(id);
let i=0,theme='light';
const sg=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};const gg=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
function parseHash(){const m=location.hash.slice(1).split('/');const k=M.findIndex(s=>s.slug===m[0]);if(k>=0)i=k;
 if(m[1]==='dark'||m[1]==='light')theme=m[1];else theme=gg('theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function build(){const g={};M.forEach((s,k)=>{(g[s.role]=g[s.role]||[]).push([s,k])});
 $('nav').innerHTML=Object.entries(g).map(([r,a])=>'<h2>'+r+'</h2>'+a.map(([s,k])=>'<a data-k="'+k+'"><i>'+(k+1)+'</i>'+s.title+'</a>').join('')).join('');
 $('nav').onclick=e=>{const a=e.target.closest('a');if(a){i=+a.dataset.k;render()}}}
function fit(){const s=M[i],w=s.w,h=s.h[theme];const avail=$('box').parentElement.clientWidth-(innerWidth>820?44:24);const k=Math.min(1,avail/w);
 const f=$('frame');f.style.width=w+'px';f.style.height=h+'px';f.style.transform='scale('+k+')';$('box').style.width=w*k+'px';$('box').style.height=h*k+'px';const fr=$('fr');fr.width=w;fr.height=h}
function render(){const s=M[i];document.documentElement.dataset.theme=theme;
 $('tl').setAttribute('aria-pressed',theme==='light');$('td').setAttribute('aria-pressed',theme==='dark');
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',+a.dataset.k===i));
 $('ttl').textContent=s.title;$('role').textContent=s.role;
 const src='screens/'+theme+'/'+s.slug+'.html';if($('fr').getAttribute('src')!==src)$('fr').setAttribute('src',src);
 fit();history.replaceState(null,'','#'+s.slug+'/'+theme);document.title=s.title+' · Alem AI Prototype'}
$('tl').onclick=()=>{theme='light';sg('theme',theme);render()};$('td').onclick=()=>{theme='dark';sg('theme',theme);render()};
addEventListener('keydown',e=>{if(e.key==='ArrowRight'){i=(i+1)%M.length;render()}if(e.key==='ArrowLeft'){i=(i+M.length-1)%M.length;render()}});
addEventListener('resize',fit);addEventListener('hashchange',()=>{parseHash();render()});
parseHash();build();render();
</script></body></html>
